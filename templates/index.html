<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONBITEK - Cronograma, Búsqueda y Combinadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-blue-950 text-blue-50 min-h-screen">

    <!-- Encabezado Azul, Naranja y Amarillo -->
    <header class="bg-blue-900/95 border-b-2 border-orange-500 py-5 px-6 shadow-xl">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-400">
                    ⚡ CONBITEK <span class="text-orange-400">SMARTBET</span>
                </h1>
                <p class="text-blue-200 text-sm mt-0.5">
                    Cronograma por liga, buscador en vivo y métricas para armar combinadas
                </p>
            </div>
            <button onclick="cargarPartidos()" class="bg-orange-500 hover:bg-orange-400 text-blue-950 font-extrabold px-6 py-3 rounded-xl transition shadow-lg shadow-orange-500/25 cursor-pointer">
                🔄 Actualizar Cartelera
            </button>
        </div>
    </header>

    <!-- Toast -->
    <div id="toastCopiado" class="hidden fixed bottom-5 right-5 z-50 bg-amber-400 text-blue-950 font-bold px-4 py-3 rounded-xl shadow-2xl border border-orange-500">
        ✅ Pick copiado para tu combinada
    </div>

    <main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">

        <!-- Controles: Buscador + Filtro de Estado -->
        <section class="bg-blue-900/70 border border-blue-700 rounded-2xl p-4 md:p-5 space-y-4 shadow-lg">
            <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
                <div class="relative flex-1">
                    <input
                        id="inputBusqueda"
                        type="text"
                        oninput="aplicarFiltros()"
                        placeholder="🔍 Buscar equipo, liga o pick (ej: Arsenal, Real Madrid, Goles, Córners)..."
                        class="w-full bg-blue-950 text-white placeholder-blue-300/60 border border-blue-700 focus:border-amber-400 focus:outline-none rounded-xl px-4 py-3 text-sm"
                    />
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 bg-blue-950 border border-blue-700 px-3.5 py-3 rounded-xl text-xs font-bold text-amber-300 cursor-pointer select-none">
                        <input id="checkSoloProximos" type="checkbox" checked onchange="aplicarFiltros()" class="accent-orange-500 w-4 h-4">
                        Solo próximos / en vivo
                    </label>
                    <button onclick="limpiarFiltros()" class="bg-blue-950 hover:bg-blue-800 text-blue-200 border border-blue-700 px-4 py-3 rounded-xl text-xs font-bold cursor-pointer">
                        Limpiar
                    </button>
                </div>
            </div>

            <!-- Cronograma por Liga -->
            <div>
                <span class="block text-xs font-bold uppercase tracking-wider text-amber-300 mb-2">
                    🗓️ Cronograma por Liga:
                </span>
                <div id="barraLigas" class="flex gap-2 overflow-x-auto pb-2">
                    <button onclick="seleccionarLiga('TODAS')" data-liga="TODAS" class="liga-btn bg-orange-500 text-blue-950 font-extrabold text-xs px-4 py-2 rounded-full whitespace-nowrap cursor-pointer">
                        Todas las ligas
                    </button>
                </div>
            </div>
        </section>

        <!-- Cabecera del Listado -->
        <div class="flex items-center justify-between border-b border-blue-800 pb-3">
            <h2 id="tituloSeccion" class="text-lg md:text-xl font-bold text-amber-300">
                📋 Cartelera de Partidos
            </h2>
            <span id="contadorPartidos" class="text-xs font-semibold bg-blue-900 text-amber-300 border border-amber-400/30 px-3 py-1 rounded-full">
                Cargando...
            </span>
        </div>

        <!-- Contenedor Vertical -->
        <div id="contenedorPartidos" class="space-y-5">
            <div class="bg-blue-900/50 border border-blue-800 rounded-2xl p-10 text-center text-amber-300 animate-pulse">
                Consultando cronograma, tablas y partidos disponibles...
            </div>
        </div>
    </main>

    <script>
        let partidosData = [];
        let ligaSeleccionada = "TODAS";

        function renderBadgesForma(formaArr) {
            if (!formaArr || formaArr.length === 0) {
                return `<span class="text-xs text-blue-300">Sin racha reciente</span>`;
            }
            return formaArr.slice(-5).map(res => {
                if (res === "V") {
                    return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md text-xs font-extrabold bg-emerald-400 text-blue-950" title="Victoria">V</span>`;
                }
                if (res === "E") {
                    return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md text-xs font-extrabold bg-amber-400 text-blue-950" title="Empate">E</span>`;
                }
                return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md text-xs font-extrabold bg-orange-600 text-white" title="Derrota">D</span>`;
            }).join("");
        }

        function renderBarraLigas(ligas) {
            const barra = document.getElementById("barraLigas");
            const botonesLigas = (ligas || []).map(liga => {
                const escapada = liga.replace(/'/g, "\\'");
                return `<button onclick="seleccionarLiga('${escapada}')" data-liga="${liga}" class="liga-btn bg-blue-950 hover:bg-blue-800 text-amber-200 border border-amber-400/30 font-bold text-xs px-4 py-2 rounded-full whitespace-nowrap cursor-pointer transition">${liga}</button>`;
            }).join("");

            barra.innerHTML = `
                <button onclick="seleccionarLiga('TODAS')" data-liga="TODAS" class="liga-btn bg-orange-500 text-blue-950 font-extrabold text-xs px-4 py-2 rounded-full whitespace-nowrap cursor-pointer transition">
                    Todas las ligas
                </button>
                ${botonesLigas}
            `;
            actualizarEstilosLigas();
        }

        function actualizarEstilosLigas() {
            document.querySelectorAll(".liga-btn").forEach(btn => {
                const activa = btn.getAttribute("data-liga") === ligaSeleccionada;
                if (activa) {
                    btn.className = "liga-btn bg-orange-500 text-blue-950 font-extrabold text-xs px-4 py-2 rounded-full whitespace-nowrap cursor-pointer transition shadow";
                } else {
                    btn.className = "liga-btn bg-blue-950 hover:bg-blue-800 text-amber-200 border border-amber-400/30 font-bold text-xs px-4 py-2 rounded-full whitespace-nowrap cursor-pointer transition";
                }
            });
        }

        function seleccionarLiga(liga) {
            ligaSeleccionada = liga;
            actualizarEstilosLigas();
            aplicarFiltros();
        }

        function limpiarFiltros() {
            document.getElementById("inputBusqueda").value = "";
            document.getElementById("checkSoloProximos").checked = false;
            ligaSeleccionada = "TODAS";
            actualizarEstilosLigas();
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const texto = (document.getElementById("inputBusqueda").value || "").trim().toLowerCase();
            const soloProximos = document.getElementById("checkSoloProximos").checked;

            const filtrados = partidosData.filter(p => {
                if (soloProximos && p.yaJugado) return false;
                if (ligaSeleccionada !== "TODAS" && p.liga !== ligaSeleccionada) return false;

                if (texto) {
                    const haystack = `${p.equipoLocal} ${p.equipoVisitante} ${p.liga} ${p.horario} ${p.analisis.pickSugerido}`.toLowerCase();
                    if (!haystack.includes(texto)) return false;
                }
                return true;
            });

            renderPartidos(filtrados);
        }

        function renderPartidos(lista) {
            const cont = document.getElementById("contenedorPartidos");
            const badge = document.getElementById("contadorPartidos");
            const titulo = document.getElementById("tituloSeccion");

            titulo.textContent = ligaSeleccionada === "TODAS"
                ? "📋 Cronograma de Partidos"
                : `🗓️ Cronograma — ${ligaSeleccionada}`;

            badge.textContent = `${lista.length} de ${partidosData.length} partidos`;

            if (!lista || lista.length === 0) {
                cont.innerHTML = `
                    <div class="bg-blue-900/60 border border-amber-400/40 rounded-2xl p-8 text-center text-blue-100 space-y-3">
                        <p class="font-bold text-amber-300">No se encontraron partidos con ese filtro.</p>
                        <button onclick="limpiarFiltros()" class="bg-orange-500 text-blue-950 font-extrabold text-xs px-4 py-2 rounded-lg cursor-pointer">
                            Mostrar todos los partidos
                        </button>
                    </div>`;
                return;
            }

            cont.innerHTML = lista.map(p => {
                const a = p.analisis;
                const l = p.statsLocal;
                const v = p.statsVisitante;
                const tagEstado = p.yaJugado
                    ? `<span class="bg-blue-950 text-blue-300 border border-blue-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full">Finalizado</span>`
                    : `<span class="bg-amber-400/20 text-amber-300 border border-amber-400/50 text-[11px] font-bold px-2.5 py-0.5 rounded-full">Próximo / Activo</span>`;

                return `
                    <div class="bg-blue-900/80 border border-blue-700 hover:border-amber-400 rounded-2xl p-5 md:p-6 shadow-xl transition">
                        <div class="flex flex-wrap justify-between items-center gap-2 pb-3 border-b border-blue-800" onclick="togglePanel(${p.id})">
                            <div class="flex items-center gap-2 flex-wrap cursor-pointer">
                                <span class="bg-orange-500 text-blue-950 font-extrabold text-xs uppercase px-3 py-1 rounded-full">
                                    🏆 ${p.liga}
                                </span>
                                ${tagEstado}
                            </div>
                            <span class="bg-blue-950 text-amber-300 border border-amber-400/40 font-semibold text-xs px-3 py-1 rounded-full cursor-pointer">
                                🕒 ${p.horario}
                            </span>
                        </div>

                        <div class="mt-4 flex flex-col lg:flex-row lg:items-center justify-between gap-4 cursor-pointer" onclick="togglePanel(${p.id})">
                            <div>
                                <h3 class="text-xl md:text-2xl font-extrabold text-white">
                                    ${p.equipoLocal} <span class="text-orange-400 font-bold mx-1">vs</span> ${p.equipoVisitante}
                                </h3>
                                <p class="text-xs text-blue-300 mt-1">
                                    Tabla: <strong class="text-amber-300">${p.equipoLocal} (${p.posicionLocal}°, ${p.puntosLocal} pts)</strong> vs <strong class="text-amber-300">${p.equipoVisitante} (${p.posicionVisitante}°, ${p.puntosVisitante} pts)</strong>
                                </p>
                            </div>

                            <div class="bg-blue-950 border border-amber-400/50 rounded-xl px-4 py-3 lg:text-right">
                                <span class="block text-[11px] uppercase tracking-wider text-amber-300 font-bold">
                                    🎯 Pick Combinada (~${a.cuotaEstimada}) · Conf. ${a.confianza}%
                                </span>
                                <span class="block text-sm md:text-base font-extrabold text-orange-400 mt-0.5">
                                    ${a.pickSugerido}
                                </span>
                            </div>
                        </div>

                        <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
                            <button onclick="togglePanel(${p.id})" class="text-xs font-bold text-amber-300 hover:text-amber-200 underline cursor-pointer">
                                📊 Ver tabla, goles, córners, amarillas y últimos 5
                            </button>
                            <button onclick="copiarPick(${p.id})" class="bg-amber-400 hover:bg-amber-300 text-blue-950 font-extrabold text-xs px-4 py-2 rounded-lg transition cursor-pointer">
                                📋 Copiar para Combinada
                            </button>
                        </div>

                        <div id="panel-${p.id}" class="hidden mt-5 pt-5 border-t border-blue-800 space-y-4">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-xs md:text-sm">
                                    <thead>
                                        <tr class="bg-blue-950 text-amber-300 border-b border-blue-700">
                                            <th class="p-3">Métrica</th>
                                            <th class="p-3">${p.equipoLocal}</th>
                                            <th class="p-3">${p.equipoVisitante}</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-blue-800/80 bg-blue-950/50">
                                        <tr>
                                            <td class="p-3 font-semibold text-blue-200">Racha / Historial</td>
                                            <td class="p-3">
                                                <div class="flex items-center gap-1.5 flex-wrap">
                                                    ${renderBadgesForma(l.forma)}
                                                    <span class="text-xs text-blue-300 ml-1">(${l.resumen})</span>
                                                </div>
                                            </td>
                                            <td class="p-3">
                                                <div class="flex items-center gap-1.5 flex-wrap">
                                                    ${renderBadgesForma(v.forma)}
                                                    <span class="text-xs text-blue-300 ml-1">(${v.resumen})</span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td class="p-3 font-semibold text-blue-200">Goles A Favor / En Contra</td>
                                            <td class="p-3 font-bold text-amber-300">${l.prom_gf} GF / ${l.prom_gc} GC</td>
                                            <td class="p-3 font-bold text-amber-300">${v.prom_gf} GF / ${v.prom_gc} GC</td>
                                        </tr>
                                        <tr>
                                            <td class="p-3 font-semibold text-blue-200">Frecuencia Anotadora</td>
                                            <td class="p-3 text-white">${l.pct_anota}% anota</td>
                                            <td class="p-3 text-white">${v.pct_anota}% anota</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div class="bg-blue-950 border border-blue-800 rounded-xl p-3">
                                    <span class="text-blue-300 block">⚽ Ambos Anotan</span>
                                    <strong class="text-amber-300 text-sm">${a.ambosAnotan}</strong>
                                </div>
                                <div class="bg-blue-950 border border-blue-800 rounded-xl p-3">
                                    <span class="text-blue-300 block">🚩 Córners Est.</span>
                                    <strong class="text-orange-400 text-sm">${a.cornersPromedio}</strong>
                                </div>
                                <div class="bg-blue-950 border border-blue-800 rounded-xl p-3">
                                    <span class="text-blue-300 block">🟨 Amarillas Est.</span>
                                    <strong class="text-amber-300 text-sm">${a.amarillasPromedio}</strong>
                                </div>
                                <div class="bg-blue-950 border border-blue-800 rounded-xl p-3">
                                    <span class="text-blue-300 block">🚩 Fueras de Juego</span>
                                    <strong class="text-blue-100 text-sm">${a.offsidesPromedio}</strong>
                                </div>
                            </div>

                            <div class="bg-blue-950/90 border-l-4 border-orange-500 rounded-r-xl p-4 text-xs md:text-sm text-blue-100">
                                <strong class="text-amber-400">📌 Lectura para Combinada:</strong> ${a.diagnostico}
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        async function cargarPartidos() {
            const cont = document.getElementById("contenedorPartidos");
            const badge = document.getElementById("contadorPartidos");

            cont.innerHTML = `
                <div class="bg-blue-900/50 border border-blue-800 rounded-2xl p-10 text-center text-amber-300 animate-pulse">
                    Cargando cronograma, ligas y métricas de partidos...
                </div>`;

            try {
                const resp = await fetch("/api/analizar-partidos");
                const data = await resp.json();
                partidosData = data.partidos || [];

                renderBarraLigas(data.ligas || []);
                aplicarFiltros();
            } catch (err) {
                badge.textContent = "Error";
                cont.innerHTML = `
                    <div class="bg-blue-900/60 border border-orange-500 rounded-2xl p-8 text-center text-orange-300">
                        ❌ No se pudo cargar la cartelera desde el servidor.
                    </div>`;
            }
        }

        function togglePanel(id) {
            const el = document.getElementById(`panel-${id}`);
            if (el) el.classList.toggle("hidden");
        }

        function copiarPick(id) {
            const p = partidosData.find(item => item.id === id);
            if (!p) return;
            const texto = [
                `🏆 ${p.liga} | 🕒 ${p.horario}`,
                `⚽ ${p.equipoLocal} vs ${p.equipoVisitante}`,
                `🎯 Pick: ${p.analisis.pickSugerido} (Cuota ~${p.analisis.cuotaEstimada})`,
                `📊 ${p.analisis.ambosAnotan} | ${p.analisis.cornersPromedio} | ${p.analisis.amarillasPromedio}`
            ].join("\n");

            navigator.clipboard.writeText(texto).then(() => {
                const toast = document.getElementById("toastCopiado");
                toast.classList.remove("hidden");
                setTimeout(() => toast.classList.add("hidden"), 2200);
            });
        }

        window.onload = cargarPartidos;
    </script>
</body>
</html>
