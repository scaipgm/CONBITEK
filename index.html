<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA SmartBet - Motor Real de Partidos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="bg-slate-900 border-b border-slate-800 py-6 px-8 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    🤖 IA SmartBet - Live API Engine
                </h1>
                <p class="text-slate-400 text-sm">Sistema conectado a datos reales de partidos de fútbol mundial</p>
            </div>
            <button onclick="cargarPartidosReales()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                🔄 Consultar Partidos de Hoy (API Real)
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-8">
        <section>
            <h2 class="text-xl font-semibold mb-4 text-slate-200">Selección Optimizada del Día</h2>
            <div id="resultadoContainer" class="space-y-4">
                <div class="bg-slate-900/40 border border-dashed border-slate-800 rounded-2xl p-10 text-center text-slate-500">
                    Haz clic en <span class="text-emerald-400 font-medium">"Consultar Partidos de Hoy"</span> para conectar con el servidor de Python y la API.
                </div>
            </div>
        </section>
    </main>

    <script>
        async function cargarPartidosReales() {
            const contenedor = document.getElementById("resultadoContainer");
            contenedor.innerHTML = `<div class="text-center py-10 text-emerald-400 animate-pulse">Conectando con la API de fútbol y procesando variables contextuales...</div>`;

            try {
                const response = await fetch('http://127.0.0.1:5000/api/analizar-partidos');
                const data = await response.json();

                if (data.status === "error") {
                    contenedor.innerHTML = `<div class="bg-red-950/40 border border-red-500/30 p-6 rounded-xl text-red-300 text-center">❌ Error: ${data.message}</div>`;
                    return;
                }

                if (data.combinadas.length === 0) {
                    contenedor.innerHTML = `<div class="bg-slate-900 p-6 rounded-xl text-center text-slate-400">No hay partidos suficientes hoy que superen el filtro de eficiencia del 80%.</div>`;
                    return;
                }

                let htmlContent = ``;
                data.combinadas.forEach(p => {
                    htmlContent += `
                        <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider">${p.liga}</span>
                                <h4 class="text-lg font-bold text-white mt-1">${p.equipoLocal} vs ${p.equipoVisitante}</h4>
                                <p class="text-xs text-slate-400 mt-1">🕒 Horario UTC: ${p.fecha}</p>
                                <p class="text-sm text-cyan-300 font-medium mt-2">🎯 Sugerencia IA: ${p.mercado}</p>
                                <p class="text-xs text-slate-400 mt-2 bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/60">
                                    🧠 ${p.analisisIA}
                                </p>
                            </div>
                            <div class="text-right flex md:flex-col justify-between w-full md:w-auto items-center md:items-end border-t md:border-t-0 pt-3 md:pt-0 border-slate-800">
                                <span class="text-xs text-slate-400">Cuota Est.: <strong class="text-white text-base">${p.cuotaEstimada}</strong></span>
                                <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-md mt-1 font-semibold">Confianza: ${p.probabilidad}%</span>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML = htmlContent;

            } catch (err) {
                contenedor.innerHTML = `<div class="bg-red-950/40 border border-red-500/30 p-6 rounded-xl text-red-300 text-center">❌ No se pudo conectar con el servidor backend de Python. Asegúrate de ejecutar 'python app.py'.</div>`;
            }
        }
    </script>
</body>
</html>
